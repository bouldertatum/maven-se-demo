openapi: 3.1.0
info:
  title: Synthetic Telecom Support API
  version: 0.1.0
  description: Public-demo API using fictional customer, network, usage, and case data.
servers:
  - url: http://localhost:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Service health
  /customers/{customerId}/context:
    get:
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Authenticated synthetic customer context }
        "401": { description: Unauthorized }
        "404": { description: Customer not found }
  /customers/{customerId}/roaming:
    get:
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Synthetic roaming, network, usage, and charge state }
        "401": { description: Unauthorized }
        "404": { description: Customer not found }
  /customers/{customerId}/network-registration/refresh:
    post:
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, const: true }
      responses:
        "200": { description: Registration refresh result }
        "400": { description: Missing confirmation or idempotency key }
  /escalations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, reason, summary]
              properties:
                customerId: { type: string }
                reason: { type: string }
                requestedCreditAmount: { type: number }
                summary: { type: string }
                evidence:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: Structured escalation created }
        "400": { description: Required evidence missing }

